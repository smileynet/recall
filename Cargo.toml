[package]
name = "recall"
version = "0.1.0"
edition = "2021"
description = "Cross-session semantic memory for AI coding assistants"
license = "MIT"
repository = "https://github.com/smileynet/recall"
keywords = ["cli", "semantic-search", "embeddings", "memory", "ai"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
fastembed = { version = "4", default-features = false, features = ["ort-load-dynamic", "hf-hub-native-tls"] }
ort = { version = "=2.0.0-rc.9", features = ["load-dynamic", "ndarray"], default-features = false }
ureq = "2"
flate2 = "1"
tar = "0.4"
jwalk = "0.8"
sha2 = "0.10"
fs2 = "0.4"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2.0"
predicates = "3.1"
insta = { version = "1", features = ["filters"] }
insta-cmd = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
