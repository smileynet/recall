[package]
name = "recall"
version = "0.1.0"
edition = "2021"
description = "Cross-session semantic memory for AI coding assistants"
license = "MIT"
repository = "https://github.com/smileynet/recall"
keywords = ["cli", "semantic-search", "embeddings", "memory", "ai"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
fastembed = { version = "7", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }
ort = { version = "=2.0.0-rc.13", features = ["load-dynamic", "ndarray", "api-24"], default-features = false }
# Pin ort-sys exactly to match ort. ort rc.13 pins ort-sys exactly, but a direct
# pin here keeps the resolve stable and documents the coupling (ADR 0003). The
# loose-range drift that bit rc.9->rc.10 (ticket 068) does not recur at rc.13,
# but the explicit pin is defense-in-depth for lockfile-free resolves.
ort-sys = "=2.0.0-rc.13"
# Pre-flight ONNX RT dylib validation (ticket 068): dlopen + check OrtGetApiBase
# / GetVersionString before handing the lib to ort, which otherwise panics on a
# bad DLL. Matches the version ort pulls transitively.
libloading = "0.8"
ureq = { version = "2", features = ["json"] }
flate2 = "1"
tar = "0.4.45"
lzma-rust2 = { version = "=0.20.1", default-features = false, features = ["std", "xz", "encoder"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
jwalk = "0.8"
sha2 = "0.10"
fs2 = "0.4"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
insta = { version = "1", features = ["filters"] }
insta-cmd = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
